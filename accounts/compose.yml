# A separate Keycast database, Redis, encryption key and account identity.
# Prepare the pinned source first. No production credentials are inherited.
name: holoboard-accounts
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: keycast
      POSTGRES_DB: keycast
      POSTGRES_PASSWORD: ${KEYCAST_DB_PASSWORD:?Set an isolated database password}
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycast"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
  keycast:
    image: holoboard-keycast:fe9c6460
    build:
      context: ${KEYCAST_SOURCE:-../output/keycast/source}
    env_file: ${KEYCAST_SECRETS_FILE:?Set an isolated private secrets file}
    environment: &keycast-environment
      DATABASE_URL: postgres://keycast:${KEYCAST_DB_PASSWORD:?Set an isolated database password}@postgres:5432/keycast
      REDIS_URL: redis://redis:6379
      KMS_PROVIDER: file
      MASTER_KEY_PATH: /run/secrets/keycast-master
      BUNKER_RELAYS: ${KEYCAST_BUNKER_RELAYS:?Set explicit signer relays}
      ALLOWED_ORIGINS: ${KEYCAST_ALLOWED_ORIGINS:?Set the exact Holoboard and Keycast origins}
      ALLOWED_TENANT_DOMAINS: ${KEYCAST_TENANT_DOMAINS:?Set explicit account-service hostnames}
      ENABLE_TENANT_AUTO_PROVISIONING: "false"
      APP_URL: ${KEYCAST_PUBLIC_URL:?Set the account-service origin}
      BASE_URL: ${KEYCAST_PUBLIC_URL:?Set the account-service origin}
      FROM_EMAIL: ${KEYCAST_FROM_EMAIL:-noreply@example.invalid}
      FROM_NAME: Holoboard
      NODE_ENV: ${KEYCAST_ENVIRONMENT:-production}
      RUST_ENV: ${KEYCAST_ENVIRONMENT:-production}
      ENABLE_EXAMPLES: "false"
      RUST_LOG: warn
      WEB_BUILD_DIR: /app/web
      PORT: "3000"
    ports: ["127.0.0.1:${KEYCAST_PORT:-3100}:3000"]
    volumes: ["${KEYCAST_MASTER_KEY_FILE:?Set the encryption-key file}:/run/secrets/keycast-master:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  migrate:
    image: holoboard-keycast:fe9c6460
    profiles: ["setup"]
    entrypoint: ["/app/keycast", "--migrate"]
    env_file: ${KEYCAST_SECRETS_FILE:?Set an isolated private secrets file}
    environment: *keycast-environment
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  database:
  redis:
