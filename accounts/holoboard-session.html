<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holoboard account session</title>
<body><main><h1>Sign out of Holoboard</h1><p id="status" role="status">Preparing session revocation...</p><button id="revoke" hidden>Revoke Holoboard session and sign out</button><p><a href="/" target="_blank" rel="noopener noreferrer">Sign in or manage account sessions</a></p></main>
<script>
// Served on the isolated Keycast origin. Its first-party HttpOnly cookie may
// manage authorizations; the Holoboard signing token deliberately cannot.
const allowedOrigins = ["http://127.0.0.1:4173"];
const params = new URLSearchParams(location.hash.slice(1));
history.replaceState(null, '', location.pathname);
const bunker = params.get('bunker'), target = params.get('origin'), state = params.get('state');
const status = document.getElementById('status'), button = document.getElementById('revoke');
let origin;
try {
  const url = new URL(target);
  if (!allowedOrigins.includes(target) || url.origin !== target || (url.protocol !== 'https:' && !(url.protocol === 'http:' && ['localhost', '127.0.0.1'].includes(url.hostname)))) throw new Error();
  origin = url.origin;
  if (!/^[0-9a-f]{64}$/.test(bunker) || !state || !window.opener) throw new Error();
  status.textContent = 'Revoke this app session to stop further signing. Your payment wallet is independent.';
  button.hidden = false;
} catch { status.textContent = 'Open account settings from Holoboard to manage this session.'; }
button.addEventListener('click', async () => {
  button.disabled = true;
  try {
    const response = await fetch('/api/user/sessions/revoke', { method: 'POST', credentials: 'same-origin', cache: 'no-store', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ bunker_pubkey: bunker }) });
    const result = await response.json();
    if (!response.ok || result.success !== true) throw new Error();
    await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin', cache: 'no-store' });
    status.textContent = 'Session revoked. Return to Holoboard.';
    window.opener.postMessage({ type: 'holoboard-logout', state }, origin);
  } catch { status.textContent = 'Could not revoke this session. Sign in to the account service in this window, then retry. Holoboard will keep the local connection until revocation succeeds.'; button.disabled = false; }
});
</script>
</body></html>
