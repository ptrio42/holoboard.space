name: Holoboard
summary: A live market for attention on Nostr, ranked by sats.
description: |
  See what people are willing to put sats behind.

  Anyone can pay to add a Nostr note to Holoboard or boost one already on the
  board. You can promote your own post or someone else's. Sats determine the
  ranking, with recent payments counting for more.

  Browse for free, preview a note before paying, and optionally choose a
  billboard appearance. Pay a Lightning invoice without signing in. Promotion
  commands and zaps also work from Nostr clients.
website: https://holoboard.space
