name: Holoboard
summary: Discover posts and give yours more visibility with Lightning.
description: |
  A public board for things people want others to notice.

  Browse posts, follow links and explore conversations for free. Share your
  own text or link, bring an existing Nostr post, or recommend someone else's
  work. Pay with Lightning to give a post more visibility. You can post as a
  guest and pay an invoice without a Nostr account or wallet connection.

  Add to board guides you through Post, Budget and Payment. Review the total
  before preparing invoices, choose an optional Billboard appearance, and
  resume unfinished invoices on the same device and browser profile.

  Visibility payments influence ranking and lose weight over time. Optional
  support for an original author goes directly to their Lightning address and
  adds no ranking weight. Payment does not guarantee readers or a position.

  Nostr accounts, discussions and Nostr Wallet Connect are optional ways to
  explore and use the board. The Android app opens holoboard.space, so board
  features follow the website's current release.
