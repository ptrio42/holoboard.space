# fly.toml for the holoboard relay.
#
# This machine cannot scale to zero. The relay's real work is outbound: it holds
# websocket subscriptions to public relays watching for zaps, DMs and mentions,
# and none of that happens while a machine is asleep. Fly wakes a machine on an
# incoming request, and nobody sends the relay a request when someone zaps it
# somewhere else. So it runs around the clock, and that is the bill.

app = 'holoboard-relay'
primary_region = 'fra'

[build]

[env]
  DATA_FILE = '/root/data/relay_data.json'
  DEFAULT_PAYMENT_SATS = '1000'
  # Must accept writes from any pubkey, and must match VITE_PUBLIC_RELAYS in
  # web/src/config.ts, or mentions published by the frontend land somewhere
  # this relay is not listening.
  FETCH_RELAYS = 'wss://nos.lol,wss://relay.damus.io,wss://relay.primal.net,wss://nostr.mom,wss://offchain.pub'
  # Nostr Wallet Connect. Needs an NWC_URI secret; see relay/.env.example.
  LIGHTNING_BACKEND = 'nwc'
  # How often to re-check invoices still waiting. Coinos pushes
  # payment_received, so this is the backstop rather than the main path.
  INVOICE_CHECK_SECONDS = '60'
  # Shown to people, not just to developers reading a relay document: clients
  # like Jumble put this on the relay's card above the feed.
  RELAY_DESCRIPTION = 'A bulletin board where the order is decided by sats and nothing else. Every note was paid for, and anyone can pay to push any note higher.'
  PORT = '8080'

[[mounts]]
  source = 'relay_data'
  destination = '/root/data'

# One service definition only. Declaring [http_service] and [[services]] both on
# the same internal port, as this file used to, gives Fly two conflicting
# descriptions of the same ports.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  # Nothing stops this machine on purpose, but when something does, false
  # leaves it down until a human notices. The frontend opens a websocket, which
  # is an HTTP upgrade, so a visitor is enough to bring it back.
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Every board reader holds a websocket open, so connections are the thing to
  # count. The limits are sized against 256MB: past a few hundred live
  # subscriptions this machine would rather refuse politely than be killed.
  [http_service.concurrency]
    type = 'connections'
    hard_limit = 500
    soft_limit = 200

[[vm]]
  # The board holds every post in memory, and there are eleven of them. The
  # previous 1GB was roughly triple the machine cost for no use.
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
