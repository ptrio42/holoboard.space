<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05010d" />
    <meta
      name="description"
      content="Read this author's profile and explore their active posts on Holoboard."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta property="og:title" content="Profile | Holoboard" />
    <meta
      property="og:description"
      content="Read this author's profile and explore their active posts on Holoboard."
    />
    <meta property="og:type" content="website" />
    <!--
      Absolute, because a crawler does not resolve relative paths, and a wide
      card rather than the small one: a thumbnail beside a headline is what a
      shared link used to look like.
    -->
    <meta property="og:image" content="https://holoboard.space/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Holoboard, lit with sats."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Profile | Holoboard" />
    <meta name="twitter:description" content="Read this author's profile and explore their active posts on Holoboard." />
    <meta name="twitter:image" content="https://holoboard.space/og.png" />
    <title>Profile | Holoboard</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div data-nosnippet>
        <p>Holoboard is a public board for posts and links. Browse for free and pay to give a post more visibility.</p>
        <p>Enable JavaScript to browse the live board.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
