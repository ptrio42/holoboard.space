<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05010d" />
    <meta
      name="description"
      content="A pay-to-promote bulletin board on Nostr. Rank is sats, and recent sats count for more."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:url" content="https://holoboard.space/" />
    <meta property="og:title" content="holoboard.space" />
    <meta
      property="og:description"
      content="A pay-to-promote bulletin board on Nostr. Rank is sats, and recent sats count for more."
    />
    <meta property="og:type" content="website" />
    <!--
      Absolute, because a crawler does not resolve relative paths, and a wide
      card rather than the small one: a thumbnail beside a headline is what a
      shared link used to look like.
    -->
    <meta property="og:image" content="https://holoboard.space/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Holoboard, lit with sats."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://holoboard.space/og.png" />
    <title>holoboard.space</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      holoboard renders a live Nostr relay feed, so it needs JavaScript. The board itself is
      readable from any Nostr client that can query wss://relay.holoboard.space.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
